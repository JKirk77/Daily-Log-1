<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lakehead Daily Log</title>
<meta name="theme-color" content="#12232B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Log">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: one question group per screen, big tap targets, fixed Back/Next bar. Look: site-office paperwork, lake-slate ink, hi-vis orange only for the action that moves you forward. */
:root{
  color-scheme:light;
  --bg:#F0F3F2; --card:#FFFFFF; --ink:#12232B; --muted:#53666D; --line:#CFD8D5; --chip:#E3EAE8;
  --accent:#C2410C; --on-accent:#FFFFFF; --ok:#157A3C; --bad:#B42318; --focus:#1D6FA5;
  --font-d:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-b:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A1F; --card:#172830; --ink:#E7EEEB; --muted:#94A9B0; --line:#2B414A; --chip:#223741;
  --accent:#FB923C; --on-accent:#1A0E05; --ok:#4ADE80; --bad:#F87171; --focus:#60B4E8; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1A1F; --card:#172830; --ink:#E7EEEB; --muted:#94A9B0; --line:#2B414A; --chip:#223741;
  --accent:#FB923C; --on-accent:#1A0E05; --ok:#4ADE80; --bad:#F87171; --focus:#60B4E8; color-scheme:dark;}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.4 var(--font-b);margin:0;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* header */
.top{padding-block:16px 4px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:600 13px var(--font-b);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand b{font-weight:600;color:var(--ink)}
.prog{display:flex;gap:4px;margin:8px 0 12px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--chip)}
.prog i.on{background:var(--accent)}
.prog i.now{background:var(--ink)}
h1{font:700 34px/1.05 var(--font-d);letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted);font-size:16px}

/* fields */
.stack{display:flex;flex-direction:column;gap:18px;padding-top:12px}
.f label,.lbl{display:block;font:600 14px var(--font-b);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.req{color:var(--accent)}
.in{width:100%;min-height:54px;font:500 18px var(--font-b);padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);appearance:none;-webkit-appearance:none}
textarea.in{min-height:120px;resize:vertical;line-height:1.4}
.in.err{border-color:var(--bad)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2>*{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:50px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font:600 17px var(--font-b);display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"]::before{content:"\2713";font-weight:700}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.seg .chip{justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.note{font-size:15px;color:var(--muted)}

/* steppers */
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:50px;height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--chip);font:700 26px/1 var(--font-b);display:grid;place-items:center;padding:0}
.stepper button:active{background:var(--line)}
.stepper input{width:58px;height:50px;text-align:center;font:700 22px var(--font-b);font-variant-numeric:tabular-nums;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:0}
.stepper input.nz,.num.nz{border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px}
.line .nm{font-weight:600;min-width:0}

/* crew accordion */
.craft{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.craft>button{width:100%;min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;border:0;background:none;text-align:left}
.craft .nm{font-weight:600;font-size:18px}
.craft .sum{font:600 15px var(--font-b);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.craft .sum.nz{color:var(--ink)}
.craft .body{display:none;padding:4px 14px 14px;border-top:1px solid var(--line)}
.craft.open .body{display:block}
.craft.open>button{background:var(--chip)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-top:10px}
.pair>div{min-width:0}
.pair .lbl{margin-bottom:6px}
.totals{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:flex;gap:10px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font:600 15px var(--font-b);justify-content:space-between}
.totals b{font:700 24px var(--font-d);margin-left:6px;font-variant-numeric:tabular-nums}

/* production */
.prod{display:flex;flex-direction:column;gap:10px}
.prod .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prod .hd b{font-size:18px}
.prod .hd span{font:600 14px var(--font-b);color:var(--muted)}
.num{width:100%;min-height:54px;text-align:center;font:600 20px var(--font-b);font-variant-numeric:tabular-nums;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:0 10px}

/* voice */
.mic{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:66px;border-radius:12px;border:2px solid var(--accent);background:var(--card);color:var(--accent);font:700 22px var(--font-d);letter-spacing:.04em;text-transform:uppercase}
.mic svg{width:28px;height:28px}
.mic.live{background:var(--accent);color:var(--on-accent);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.78}}
@media (prefers-reduced-motion:reduce){.mic.live{animation:none}}
.tip{display:flex;gap:10px;font-size:15px;color:var(--muted);background:var(--chip);border-radius:10px;padding:10px 12px}
.tip.warn{color:var(--ink);border-left:4px solid var(--accent)}

/* switch */
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:60px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;text-align:left}
.sw .t{font-weight:600}
.sw .pill{flex:none;width:52px;height:30px;border-radius:15px;background:var(--chip);border:1.5px solid var(--line);position:relative}
.sw .pill::after{content:"";position:absolute;top:2px;left:2px;width:23px;height:23px;border-radius:50%;background:var(--muted)}
.sw[aria-pressed="true"] .pill{background:var(--accent);border-color:var(--accent)}
.sw[aria-pressed="true"] .pill::after{left:24px;background:var(--on-accent)}

/* review */
.rv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:16px}
.rv dt{color:var(--muted)} .rv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.miss{display:flex;flex-direction:column;gap:8px}
.miss button{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:50px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--bad);background:var(--card);text-align:left;font-weight:600}
.miss button span{color:var(--bad);font:600 14px var(--font-b);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.ok{color:var(--ok);font-weight:600}
.bad{color:var(--bad);font-weight:600}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{min-height:58px;border-radius:12px;border:2px solid var(--ink);background:var(--card);font:700 22px var(--font-d);letter-spacing:.05em;text-transform:uppercase;padding:0 20px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);flex:1}
.btn.sec{flex:none}
.btn.wide{width:100%}
.btn[disabled]{opacity:.55}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:15px;padding:10px 0;min-height:44px}

/* done + office */
.big-ok{width:64px;height:64px;border-radius:50%;background:var(--ok);color:var(--bg);display:grid;place-items:center;font:700 36px var(--font-d)}
.office-row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.office-row .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.office-row .h b{font-size:18px}
.office-row p{margin:0;color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--chip);border-radius:10px;padding:8px 12px;font-size:15px;margin-top:6px}
.banner button{background:none;border:0;text-decoration:underline;color:var(--ink);font-weight:600;min-height:40px}
.msg{padding:12px 14px;border-radius:10px;font-weight:500}
.msg.e{background:var(--card);border:1.5px solid var(--bad);color:var(--ink)}
.doc-title{font:700 44px/1 var(--font-d);text-transform:uppercase;margin:8px 0 4px}
.addr{margin:0;color:var(--muted);font-size:15px}
.sec{margin-top:26px;padding-top:20px;border-top:2px solid var(--ink)}
h2{font:700 28px/1.1 var(--font-d);letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance}
</style>
</head><body>
<div class="top"><div class="wrap">
  <div class="brand"><b>Lakehead Constructors, Inc.</b><span>CORP-014</span></div>
  <h1 class="doc-title">Daily Log</h1>
  <p class="addr">3801 Winter Street, Superior, WI 54880-5560 · (715) 392-5181</p>
  <p class="sub">Fill in what applies, top to bottom. Required fields are marked <span class="req">*</span>. Tap the orange button at the bottom when done.</p>
  <div id="banner"></div>
</div></div>
<main class="wrap" id="app"></main>
<div class="bar"><div class="bar-in" id="bar"></div></div>
<script>
(function(){
"use strict";
var CRAFTS=["Ironworkers","Millwrights","Carpenters","Laborers","Pipefitters","Boilermakers","Cement Finishers","Painters","Operating Eng.","Bricklayers","Teamsters","Timekeeper","Project Engineer","Superintendent","Project Manager","Safety"];
var EQUIP=["Cranes","Forklifts","JLG/Manlifts","Scissor Lifts","Weld Machines","Vac Truck","Air Compressor","Light Plants","Loaders"];
var PROD=[["Concrete Poured","yd³"],["Concrete Forms","ft²"],["Excavation","yd³"],["Backfill","yd³"],["Structural Steel Erected","lbs"],["Rebar Installed","lbs."],["Piping Installed","ft."]];
var WEATHER=["Clear","Cloudy","Rain","Snow","Windy","Hot","Cold","Fog"];
var DELAYS=["Weather","Materials","Equipment","Labor Issues","Subcontractors","Safety","Design","Changed Conditions"];
var DRAFT_KEY="lakehead-daily-log-draft-v1";

var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmtDate(s){return /^\d{4}-\d\d-\d\d$/.test(s||"")?s.slice(5,7)+"/"+s.slice(8)+"/"+s.slice(0,4):(s||"")}
function cap(n){return Promise.resolve().then(function(){return window.claude&&window.claude.use?window.claude.use(n):null}).catch(function(){return null})}

function fresh(carry){
  return {
    date:todayStr(),
    customer:carry?carry.customer:"", jobNo:carry?carry.jobNo:"", project:carry?carry.project:"", location:carry?carry.location:"",
    workDays:carry&&+carry.workDays?String(+carry.workDays+1):(carry?carry.workDays:""),
    weather:[], temp:"", tempWhen:[], shift:carry?carry.shift:"", hrs:carry?carry.hrs:"", visitors:"",
    crew:CRAFTS.map(function(n){return {name:n,lci:0,sub:0}}),
    crewOther:[{name:"",lci:0,sub:0},{name:"",lci:0,sub:0}],
    equip:EQUIP.map(function(n){return {name:n,qty:0}}),
    prod:PROD.map(function(p){return {name:p[0],unit:p[1],today:"",total:""}}),
    prodOther:{name:"",today:"",total:""},
    extraWork:"", extraBy:"", extraDesc:"", quality:"", qualityWhy:"",
    delays:[], delayDesc:"", desc:"", completedBy:"",
    phased:false, pQC:"", pSpec:"", pInsp:"", pNonconf:"", pLost:"", pValid:""
  };
}

var S=fresh(), step=0, view="form", openCraft=-1, showErrors=false, busy=false, notice="", lastSaved=null, hadDraft=false;
var officeUnsub=null, officeDocs=null, officeErr="", isEditor=false, expandedOffice={};

/* ---------- draft on this phone ---------- */
function saveDraft(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify({S:S,step:step}))}catch(e){}}
function clearDraft(){try{localStorage.removeItem(DRAFT_KEY)}catch(e){}}
function loadDraft(){
  try{var d=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");
    if(d&&d.S&&Array.isArray(d.S.crew)&&d.S.crew.length===CRAFTS.length){S=Object.assign(fresh(),d.S);step=Math.min(+d.step||0,STEPS.length-1);hadDraft=true}}catch(e){}
}

/* ---------- state helpers ---------- */
function getP(path){return path.split(".").reduce(function(o,k){return o==null?o:o[k]},S)}
function setP(path,val){var ks=path.split("."),o=S;for(var i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=val}
function totals(){var a=0,b=0;S.crew.concat(S.crewOther).forEach(function(c){a+=+c.lci||0;b+=+c.sub||0});return {lci:a,sub:b}}

/* ---------- widgets ---------- */
function field(label,key,opts){opts=opts||{};
  var v=getP(key),bad=showErrors&&opts.req&&!String(v||"").trim();
  var el=opts.area?'<textarea class="in'+(bad?' err':'')+'" id="f-'+key+'" data-k="'+key+'" rows="'+(opts.rows||3)+'" placeholder="'+esc(opts.ph||"")+'">'+esc(v)+'</textarea>'
    :'<input class="in'+(bad?' err':'')+'" id="f-'+key+'" data-k="'+key+'" type="'+(opts.type||"text")+'" value="'+esc(v)+'" placeholder="'+esc(opts.ph||"")+'"'+(opts.mode?' inputmode="'+opts.mode+'"':'')+' autocomplete="off" enterkeyhint="next">';
  return '<div class="f"><label for="f-'+key+'">'+label+(opts.req?' <span class="req">*</span>':'')+'</label>'+el+'</div>';
}
function chips(label,key,vals){
  return '<div class="f"><span class="lbl">'+label+'</span><div class="chips">'+vals.map(function(v){
    return '<button type="button" class="chip" data-chip="'+key+'" data-v="'+esc(v)+'" aria-pressed="'+(S[key].indexOf(v)>-1)+'">'+esc(v)+'</button>'}).join("")+'</div></div>';
}
function seg(label,key,vals,req){
  var bad=showErrors&&req&&!S[key];
  return '<div class="f"><span class="lbl">'+label+(req?' <span class="req">*</span>':'')+(bad?' <span class="bad">Pick one</span>':'')+'</span><div class="seg">'+vals.map(function(v){
    return '<button type="button" class="chip" data-seg="'+key+'" data-v="'+esc(v)+'" aria-pressed="'+(S[key]===v)+'">'+esc(v)+'</button>'}).join("")+'</div></div>';
}
function stepper(path,label){var v=getP(path);
  return '<div class="stepper" role="group" aria-label="'+esc(label)+'"><button type="button" data-step="'+path+'" data-d="-1" aria-label="Fewer">−</button>'+
    '<input id="n-'+path+'" data-k="'+path+'" data-int="1" inputmode="numeric" pattern="[0-9]*" value="'+v+'" class="'+(v>0?'nz':'')+'" aria-label="'+esc(label)+'">'+
    '<button type="button" data-step="'+path+'" data-d="1" aria-label="More">+</button></div>';
}

/* ---------- steps ---------- */
var STEPS=[
 {t:"Job info",s:"Today's date and where you are working.",h:function(){return '<div class="stack">'+
   field("Date","date",{type:"date",req:1})+field("Customer","customer",{req:1,ph:"Customer name"})+
   '<div class="row2">'+field("Job #","jobNo",{req:1,ph:"e.g. 24-118"})+field("Work days on job","workDays",{mode:"numeric",ph:"0"})+'</div>'+
   field("Project","project",{req:1,ph:"Project name"})+field("Location","location",{ph:"Site or town"})+'</div>'}},
 {t:"Conditions",s:"Weather, shift and anyone who visited the site.",h:function(){return '<div class="stack">'+
   chips("Weather","weather",WEATHER)+
   '<div class="row2">'+field("Temperature (°F)","temp",{mode:"numeric",ph:"e.g. 45"})+chips("Reading taken","tempWhen",["A.M.","P.M."])+'</div>'+
   seg("Shift","shift",["Day","Night","Other"])+seg("Hours per shift","hrs",["8","10","12"])+
   field("Visitors today (list)","visitors",{area:1,rows:3,ph:"Names and company. Leave blank if none."})+'</div>'}},
 {t:"Crew on site",s:"Tap a craft to enter numbers. Leave crafts with nobody at 0.",h:function(){
   var t=totals();
   var list=S.crew.map(function(c,i){return craftHTML(c,i,"crew."+i,false)}).join("")+S.crewOther.map(function(c,i){return craftHTML(c,16+i,"crewOther."+i,true)}).join("");
   return '<div class="stack"><div class="totals" role="status"><span>LCI<b id="totLci">'+t.lci+'</b></span><span>Subs<b id="totSub">'+t.sub+'</b></span><span>All<b id="totAll">'+(t.lci+t.sub)+'</b></span></div><div class="list" id="crewList">'+list+'</div></div>'}},
 {t:"Large equipment",s:"How many of each are on the job today.",h:function(){return '<div class="stack"><div class="list">'+S.equip.map(function(e,i){
   return '<div class="line"><span class="nm">'+esc(e.name)+'</span>'+stepper("equip."+i+".qty",e.name)+'</div>'}).join("")+'</div></div>'}},
 {t:"Production",s:"Quantities for today and the running total. Skip anything not worked.",h:function(){return '<div class="stack">'+S.prod.map(function(p,i){
   return '<div class="card prod"><div class="hd"><b>'+esc(p.name)+'</b><span>'+esc(p.unit)+'</span></div><div class="row2">'+
    numIn("Today","prod."+i+".today")+numIn("Total to date","prod."+i+".total")+'</div></div>'}).join("")+
   '<div class="card prod"><div class="hd"><b>Other</b><span>list below</span></div>'+
   '<input class="in" id="f-prodOther.name" data-k="prodOther.name" placeholder="What was installed? (with units)" value="'+esc(S.prodOther.name)+'" autocomplete="off">'+
   '<div class="row2">'+numIn("Today","prodOther.today")+numIn("Total to date","prodOther.total")+'</div></div></div>'}},
 {t:"Delays and checks",s:"Answer the three questions, then tick any delays.",h:function(){return '<div class="stack">'+
   seg("Were you directed to perform any extra work, or work outside of scope today?","extraWork",["Yes","No"],1)+
   (S.extraWork==="Yes"?'<div class="card stack" style="padding-top:14px">'+field("By whom?","extraBy",{ph:"Name of person"})+field("Describe","extraDesc",{area:1,rows:3,req:1,ph:"What extra work was requested?"})+'</div>':"")+
   seg("Were all project quality procedures followed today?","quality",["Yes","No"],1)+
   (S.quality==="No"?'<div class="card">'+field("If no, explain","qualityWhy",{area:1,rows:3,req:1,ph:"What was not followed and why?"})+'</div>':"")+
   chips("Work delays (tick all that apply)","delays",DELAYS)+
   (S.delays.length?field("Describe the delay","delayDesc",{area:1,rows:3,ph:"What happened and how long?"}):"")+'</div>'}},
 {t:"Work description",s:"What got done today, special conditions, milestones reached.",h:function(){
   var bad=showErrors&&!S.desc.trim();
   return '<div class="stack"><button type="button" class="mic" id="micBtn" data-act="mic" aria-pressed="false">'+micLabel()+'</button><div id="voiceMsg"></div>'+
   '<div class="f"><label for="f-desc">Describe daily work in progress'+' <span class="req">*</span></label><textarea class="in'+(bad?' err':'')+'" id="f-desc" data-k="desc" rows="10" placeholder="Speak, or type here. Include special conditions, delays, quality issues and finished milestones.">'+esc(S.desc)+'</textarea></div>'+
   '<div class="tip"><span>Keyboard dictation works too. Tap in the box, then tap the microphone key on your keyboard (next to the space bar on iPhone, top of the keyboard on Android).</span></div></div>'}},
